# SonarQube analysis settings, read by sonar-scanner in the Jenkinsfile's SonarQube stage.
# The server URL and token come from Jenkins (withSonarQubeEnv), the version from Cargo.toml.

# Placeholders: set to the project's key (and organization, on SonarQube Cloud).
sonar.projectKey=redesigned-vlc
sonar.projectName=RedesignedVLC
# sonar.organization=

sonar.sourceEncoding=UTF-8
sonar.sources=src,examples,build.rs
sonar.tests=src

# Unit tests live next to the code they test, so test files are picked out by name:
# `tests.rs` and `tests/` modules, and the screenshot-test harness and cases.
sonar.test.inclusions=src/**/tests.rs,src/**/tests/**,src/screenshot_test.rs,src/screenshot_test/**,src/onboarding/screenshots.rs
sonar.exclusions=src/**/tests.rs,src/**/tests/**,src/screenshot_test.rs,src/screenshot_test/**,src/onboarding/screenshots.rs

# Clippy findings, written by `cargo clippy --message-format=json`. SonarQube Server and
# SonarQube Cloud name this property differently; each ignores the other's.
sonar.rust.clippyReport.reportPaths=target/sonar/clippy.json
sonar.rust.clippy.reportPaths=target/sonar/clippy.json
# SonarQube Cloud would run Clippy again on its own; the report above already covers it.
sonar.rust.clippy.enable=false

# Coverage, written by `cargo llvm-cov --lcov`.
sonar.rust.lcov.reportPaths=target/sonar/lcov.info
