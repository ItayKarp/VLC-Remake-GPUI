# Checks every push and pull request on each platform we ship (S0.8.1): formatting,
# clippy with warnings as errors, the tests, and a release build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            features: ""
          - name: macOS arm64
            os: macos-latest
            features: ""
          - name: macOS x64
            os: macos-15-intel
            features: ""
          - name: Linux (X11 and Wayland)
            os: ubuntu-latest
            features: ""
          - name: Linux (X11 only)
            os: ubuntu-latest
            features: --no-default-features --features x11
          - name: Linux (Wayland only)
            os: ubuntu-latest
            features: --no-default-features --features wayland
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libvulkan1 libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev
      - name: Install the Metal toolchain
        if: runner.os == 'macOS'
        # GPUI compiles its shaders at build time; newer Xcode images ship without the tool.
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings
      - name: Test
        run: cargo test ${{ matrix.features }}
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ strategy.job-index }}
          path: target/screenshots/
          if-no-files-found: ignore
      - name: Release build
        run: cargo build --release ${{ matrix.features }}
