[package]
name = "RedesignedVLC"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = ["wayland", "x11"]
# Linux display servers. Both are on by default; CI also builds each one alone (S0.8.1).
# Zed's workspace turns `gpui_linux`'s defaults off, so they have to be asked for here.
wayland = ["gpui/wayland", "gpui_platform/wayland"]
x11 = ["gpui/x11", "gpui_platform/x11"]
# macOS: compile the Metal shaders when the app starts instead of at build time, for Macs
# without Xcode's Metal toolchain (`xcodebuild -downloadComponent MetalToolchain` installs it).
runtime_shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
# GPUI from Zed `main`, pinned to one commit (S0.8.2). Upstream breaks its API often, so bump
# on purpose: change every `rev` below to the same new commit, run `cargo update -p gpui`, then
# fix what broke. Keep the dev-dependency entries on the same commit.
gpui = { git = "https://github.com/zed-industries/zed", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4", default-features = false, features = ["font-kit", "windows-manifest"] }
# `font-kit` is the macOS text system; without it GPUI's Mac backend draws no text.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4", features = ["font-kit"] }
anyhow = "1"
dirs = "6"
os_info = { version = "3", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "1"
toml_edit = { version = "0.25", features = ["serde"] }
unicode-segmentation = "1"
interprocess = "2"
futures = "0.3"
# The engine loads libVLC at run time (S1.2, ADR 0001), so builds don't need it installed.
libloading = "0.8"
url = "2"
# Reading XSPF and ASX playlists (S1.3.4).
quick-xml = "0.41"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "registry", "std", "tracing-log"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Headless window tests for the component kit (`ui::tests`).
gpui = { git = "https://github.com/zed-industries/zed", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4", features = ["test-support"] }
# Screenshot tests (`screenshot_test`): the platform's text system and headless renderer.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Only used by `cargo run --example gen_icons` to regenerate the app icons.
resvg = "0.45"
ico = "0.4"
icns = "0.3"
# The S1.1 playback spike (`examples/video_spike`) uses libc for its pixel buffers.
libc = "0.2"

# The S1.1 spike: run its unit tests with `cargo test` like the app's.
[[example]]
name = "video_spike"
test = true

# Screenshot tests build the text system themselves: the platform that would own it must be
# created on the main thread, and tests run on worker threads.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { git = "https://github.com/zed-industries/zed", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4", features = ["font-kit"] }
# The S1.1 spike's `CVPixelBuffer` path; the versions must match GPUI's (`=0.3.2`).
objc2-core-foundation = { version = "=0.3.2", features = ["CFDictionary", "CFNumber", "CFString"] }
objc2-core-video = { version = "=0.3.2", features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4" }

# macOS .app bundle (`cargo install cargo-bundle && cargo bundle --release`)
[package.metadata.bundle]
name = "VLC"
identifier = "org.redesignedvlc.app"
icon = ["assets/app-icon/icon-32.png", "assets/app-icon/icon-128.png", "assets/app-icon/icon-256.png", "assets/app-icon/icon-512.png", "assets/app-icon/icon-1024.png"]
category = "public.app-category.video"
short_description = "Redesigned VLC media player"
# File types and URL schemes for Finder's "Open With" (S0.6.3); see src/app/file_types.rs.
osx_info_plist_exts = ["packaging/macos/Info.plist.ext"]

# Clean-code rules (mirrors learnrust's CLEAN_CODE.md; thresholds live in clippy.toml).
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noise here: prose in doc comments, long hex colours, and the
# pixel/float `as` casts UI layout code is made of.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
unreadable_literal = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
implicit_hasher = "allow"
# From the restriction and nursery groups: what clean Rust looks like.
cognitive_complexity = "warn"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
mod_module_files = "warn"
redundant_clone = "warn"
needless_collect = "warn"
