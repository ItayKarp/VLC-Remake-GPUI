[package]
name = "RedesignedVLC"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = ["wayland", "x11"]
# Linux display servers. Both are on by default; CI also builds each one alone (S0.8.1).
# Zed's workspace turns `gpui_linux`'s defaults off, so they have to be asked for here.
wayland = ["gpui/wayland", "gpui_platform/wayland"]
x11 = ["gpui/x11", "gpui_platform/x11"]
# macOS: compile the Metal shaders when the app starts instead of at build time, for Macs
# without Xcode's Metal toolchain (`xcodebuild -downloadComponent MetalToolchain` installs it).
runtime_shaders = ["gpui_platform/runtime_shaders"]
# Settings → Interface's Skin rows (S5.4.4, D19). Off until a skinning system exists (S8.14,
# docs/adr/0003-extensions-and-skins.md).
skins = []
# Settings → Extensions, the Add-ons & Scripts page (S5.10.4, D19). Off until an extension
# system exists (S8.14, docs/adr/0003-extensions-and-skins.md).
extensions = []

[dependencies]
# GPUI from our Zed fork (github.com/ItayKarp/zed), pinned to one commit (S0.8.2). The fork is
# upstream commit 2f808b3c plus one patch, branch `gpui-surface-colour`: the Metal surface
# shader honors each video buffer's YCbCr matrix and range (S1.1 found HD colors wrong
# without it). Upstream breaks its API often, so bump on purpose: rebase that branch onto the
# new upstream commit (drop the patch once upstream has an equivalent), change every `rev`
# below to the result, run `cargo update -p gpui`, then fix what broke. Keep the
# dev-dependency entries on the same commit.
gpui = { git = "https://github.com/ItayKarp/zed", rev = "3d49bee56ab059f70e578f757e133aa510a934e3", default-features = false, features = ["font-kit", "windows-manifest"] }
# `font-kit` is the macOS text system; without it GPUI's Mac backend draws no text.
gpui_platform = { git = "https://github.com/ItayKarp/zed", rev = "3d49bee56ab059f70e578f757e133aa510a934e3", features = ["font-kit"] }
anyhow = "1"
dirs = "6"
os_info = { version = "3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = { version = "0.25", features = ["serde"] }
unicode-segmentation = "1"
interprocess = "2"
futures = "0.3"
# The engine loads libVLC at run time (S1.2, ADR 0001), so builds don't need it installed.
libloading = "0.8"
url = "2"
# Reading XSPF and ASX playlists (S1.3.4).
quick-xml = "0.41"
# `log` is on everywhere because a Linux-only dependency turns it on there, and it adds
# branches to every event macro: without it macOS clippy scores `cognitive_complexity` lower
# than Linux CI does.
tracing = { version = "0.1", features = ["log"] }
# BGRA video frames become GPUI `RenderImage`s, which hold `image` frames (S1.4.1). Library
# covers (S4.3) are decoded from JPEG or PNG and cached, downscaled, as JPEG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "registry", "std", "tracing-log"] }
# Playback history and, later, the library (S1.7, S4): SQLite built in, so no system library is
# needed. xxh3 hashes the head and tail of a file to recognize it after a move (S1.7.2).
rusqlite = { version = "0.43", features = ["bundled"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Library path keys (S4.1): macOS file names are NFD, typed and dialog paths often NFC. Already
# built for `url`, so it adds nothing to compile.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# Subtitle text encodings (S6.1.6): Firefox's detector guesses the encoding of a subtitle file
# that is neither marked nor UTF-8, and `encoding_rs` (already built for other crates) reads it.
chardetng = "0.1"
encoding_rs = "0.8"
# Downloading subtitle files From Link in the Add Subtitles dialog (S6.4), and the OpenSubtitles
# API (S6.5): a small blocking client, run off the UI thread, with rustls for HTTPS.
ureq = "3"
# Unpacking gzipped and zipped subtitle downloads (S6.5); already built for ureq.
flate2 = "1"
# The OS window behind a GPUI window, for what GPUI has no call for: keeping a window above the
# others and moving it to another display (S5.4.1). The version must match GPUI's.
raw-window-handle = "0.6"
# Free disk space, so a recording stops before the disk fills and its file can be finished
# (S8.6). Pure Rust over rustix and windows-sys, which other crates already build.
fs4 = "1"
# Session tokens for the web remote (S8.15) from the OS's randomness; already built for other
# crates.
getrandom = "0.3"
# Signing last.fm API calls (S8.17.1), which take an MD5 of their parameters. Already built for
# the Secret Service on Linux.
md-5 = "0.10"

# The last.fm password (S5.5.3) lives in the OS keychain, never in a settings file: Keychain
# Services on macOS, Credential Manager on Windows, the Secret Service (over zbus, pure Rust)
# elsewhere.
keyring = "4"

# Video presentation path (b) (S1.4.1): IOSurface-backed `CVPixelBuffer`s for GPUI's surface
# primitive, and the power assertion that keeps the display awake (S1.4.3). The versions must
# match GPUI's (`=0.3.2`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "=0.3.2", features = ["CFDictionary", "CFNumber", "CFString"] }
objc2-core-video = { version = "=0.3.2", features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn"] }
# Hides the pointer with the auto-hidden controls (S2.8.1); GPUI only hides it while typing.
# Keeps windows above the others and moves them (S5.4.1). Asks whether a screen shows HDR (S7.5.3).
# The menu-bar icon and its menu (S8.16.1).
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSButton", "NSButtonCell", "NSCell", "NSControl", "NSCursor", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSGeometry", "NSObject", "NSString"] }
# Defines the Objective-C target the menu-bar icon's menu calls (S8.16.1). GPUI's version.
objc2 = "0.6"
# Open Capture Device (S8.9.2): the cameras and capture cards plugged in and whether this app may
# use them (AVFoundation), and the displays to capture and whether it may record the screen
# (CoreGraphics). Open Disc reads mounted volumes' devices with libc's `statfs`.
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "libc", "CGDirectDisplay", "CGDisplayConfiguration", "CGError", "CGWindow"] }
libc = "0.2"

# Asks the desktop's screen saver not to start during video (S1.4.3), and serves the tray icon as
# a StatusNotifierItem (S8.16.1). GPUI's portal support already builds zbus 5.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# Asks whether this process may run real-time threads before libVLC is told to (S5.10.2): with
# `--rt-priority` libVLC can't start its threads where that is refused.
libc = "0.2"

# The notification-area icon and its menu (S8.16.1): `Shell_NotifyIconW` and popup menus, whose
# structures are too large to declare by hand. Already built for GPUI and the tests.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Headless window tests for the component kit (`ui::tests`).
gpui = { git = "https://github.com/ItayKarp/zed", rev = "3d49bee56ab059f70e578f757e133aa510a934e3", features = ["test-support"] }
# Screenshot tests (`screenshot_test`): the platform's text system and headless renderer.
gpui_platform = { git = "https://github.com/ItayKarp/zed", rev = "3d49bee56ab059f70e578f757e133aa510a934e3", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Only used by `cargo run --example gen_icons` to regenerate the app icons. The version GPUI
# uses, so test builds compile one resvg, usvg and tiny-skia instead of two.
resvg = "0.46"
ico = "0.4"
icns = "0.3"
# The S1.1 playback spike (`examples/video_spike`) uses libc for its pixel buffers.
libc = "0.2"
# Its CPU path converts YCbCr to BGRA itself, with the right matrix (SIMD on every target).
yuvutils-rs = "0.8.3"

# The S1.1 spike: run its unit tests with `cargo test` like the app's.
[[example]]
name = "video_spike"
test = true

# Screenshot tests build the text system themselves: the platform that would own it must be
# created on the main thread, and tests run on worker threads.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { git = "https://github.com/ItayKarp/zed", rev = "3d49bee56ab059f70e578f757e133aa510a934e3", features = ["font-kit"] }

# The S1.1 spike's CPU time and peak memory on Windows.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_wgpu = { git = "https://github.com/ItayKarp/zed", rev = "3d49bee56ab059f70e578f757e133aa510a934e3" }

# macOS .app bundle (`cargo install cargo-bundle && cargo bundle --release`). Bundle a release on
# a Mac with Xcode's Metal toolchain and without `runtime_shaders`, so the shaders are compiled
# into the app instead of on every launch.
[package.metadata.bundle]
name = "VLC"
identifier = "org.redesignedvlc.app"
icon = ["assets/app-icon/icon-32.png", "assets/app-icon/icon-128.png", "assets/app-icon/icon-256.png", "assets/app-icon/icon-512.png", "assets/app-icon/icon-1024.png"]
category = "public.app-category.video"
short_description = "Redesigned VLC media player"
# File types and URL schemes for Finder's "Open With" (S0.6.3); see src/app/file_types.rs.
osx_info_plist_exts = ["packaging/macos/Info.plist.ext"]

# Build profiles. Debug builds keep file and line numbers for panics and backtraces, not the
# full debug info a debugger reads: less to write and link on every rebuild, and a GPUI binary
# with full debug info outgrows CI's Raspberry Pi's memory while linking. Attach a debugger with
# `CARGO_PROFILE_DEV_DEBUG=full`.
[profile.dev]
debug = "line-tables-only"

# Crates on the playback and library paths are optimized even in debug builds: unoptimized, the
# player converts frames and decodes covers many times slower. They rarely change, so they
# build once. SQLite's C code takes its optimization level from `libsqlite3-sys`'s.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.yuvutils-rs]
opt-level = 3
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3
[profile.dev.package.xxhash-rust]
opt-level = 3
[profile.dev.package.chardetng]
opt-level = 3
[profile.dev.package.encoding_rs]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# What ships: one codegen unit and thin LTO let LLVM optimize across crates, which makes the app
# a fifth smaller. Playback runs no faster for it, since libVLC decodes and the GPU draws, so fat
# LTO and profile-guided optimization aren't worth their much longer builds; `release-fast` is
# as fast to use. Line tables go into a separate debug file (a .dSYM on macOS), so crash reports
# can be symbolicated while the binary carries none. Panics still unwind: GPUI and the tests rely
# on it.
[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "debuginfo"

# Optimized, but quick to build: for CI's release build, which only has to show the release
# build compiles, and for trying performance locally (`cargo run --profile release-fast`).
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Clean-code rules (mirrors learnrust's CLEAN_CODE.md; thresholds live in clippy.toml).
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noise here: prose in doc comments, long hex colours, and the
# pixel/float `as` casts UI layout code is made of.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
unreadable_literal = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
implicit_hasher = "allow"
# From the restriction and nursery groups: what clean Rust looks like.
cognitive_complexity = "warn"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
mod_module_files = "warn"
redundant_clone = "warn"
needless_collect = "warn"

